name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # pytest.ini: -m "not ui", --cov-branch; .coveragerc: fail_under = 100. DynamoDB is mocked with moto.
      - run: python -m pytest
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  ui:
    name: UI tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m ui --no-cov -v

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start MockHRIS and DynamoDB Local
        run: docker compose up -d --build
      - name: Wait for health, then check seeding, the GUI, a sync and verify against the built-in mock
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8000/api/stats | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['users'] > 400, s"
          curl -fsS http://localhost:8000/ui/ | grep -q MockHRIS
          RUN=$(curl -fsS -X POST http://localhost:8000/api/integrations/github-emu/sync -H 'Content-Type: application/json' -d '{}' | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          for i in $(seq 1 120); do
            STATUS=$(curl -fsS http://localhost:8000/api/runs/$RUN | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$STATUS" != "running" ] && break
            sleep 2
          done
          echo "sync status: $STATUS"; [ "$STATUS" = "succeeded" ]
          curl -fsS -X POST http://localhost:8000/api/integrations/github-emu/verify | python3 -c "import json,sys; v=json.load(sys.stdin); assert v['ok'], v['users']"
      - name: Container logs
        if: failure()
        run: docker compose logs
